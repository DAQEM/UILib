plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id-common"
        }
    }
}

// Expose source sets so the loader-specific testmods can bundle them exactly like the main project
configurations {
    testmodCommonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    testmodCommonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    testmodCommonJava sourceSets.main.java.sourceDirectories.singleFile
    testmodCommonResources sourceSets.main.resources.sourceDirectories.singleFile
}